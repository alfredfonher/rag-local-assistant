[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "local-rag-assistant"
version = "1.0.0"
description = "Local-first RAG toolkit for indexing and querying personal knowledge bases."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "local-rag-assistant" },
]
dependencies = [
  "click>=8.1.7",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "psutil>=6.0.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.4",
  "pypdf>=5.0.0",
  "python-frontmatter>=1.1.0",
  "Markdown>=3.6",
  "PyYAML>=6.0.1",
  "tqdm>=4.66.4",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
]
local-runtime = [
  "chromadb>=0.5.0",
  "llama-cpp-python>=0.2.90; python_version < '3.14'",
]

[project.scripts]
local-rag-assistant = "local_rag_assistant.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

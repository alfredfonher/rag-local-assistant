services:
  local-rag-assistant:
    build:
      context: .
    ports:
      - "127.0.0.1:90:8000"
    environment:
      LOCAL_RAG_ASSISTANT_CHROMA_DB_PATH: ${LOCAL_RAG_ASSISTANT_CHROMA_DB_PATH:-./data/chroma_db}
      LOCAL_RAG_ASSISTANT_CHROMA_COLLECTION_NAME: ${LOCAL_RAG_ASSISTANT_CHROMA_COLLECTION_NAME:-documents}
      LOCAL_RAG_ASSISTANT_EMBEDDING_MODEL_PATH: ${LOCAL_RAG_ASSISTANT_EMBEDDING_MODEL_PATH:-./models/nomic-embed-text-v1.5.f32.gguf}
      LOCAL_RAG_ASSISTANT_LLM_MODEL_PATH: ${LOCAL_RAG_ASSISTANT_LLM_MODEL_PATH:-./models/gemma-3-1b-it-Q4_K_M.gguf}
      LOCAL_RAG_ASSISTANT_CHUNK_SIZE: ${LOCAL_RAG_ASSISTANT_CHUNK_SIZE:-512}
      LOCAL_RAG_ASSISTANT_CHUNK_OVERLAP: ${LOCAL_RAG_ASSISTANT_CHUNK_OVERLAP:-64}
      LOCAL_RAG_ASSISTANT_EMBEDDING_BATCH_SIZE: ${LOCAL_RAG_ASSISTANT_EMBEDDING_BATCH_SIZE:-32}
      LOCAL_RAG_ASSISTANT_DEFAULT_TOP_K: ${LOCAL_RAG_ASSISTANT_DEFAULT_TOP_K:-5}
      LOCAL_RAG_ASSISTANT_EMBEDDING_DIM: ${LOCAL_RAG_ASSISTANT_EMBEDDING_DIM:-768}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
